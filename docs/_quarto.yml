project:
  type: website
  output-dir: _site

website:
  title: "Documentación de la App"
  description: "Guía técnica: arquitectura, desarrollo, API y despliegue"
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: 00-prd/PRD.qmd
        text: PRD
      - href: 01-primeros-pasos/requisitos.qmd
        text: Primeros pasos
      - href: 02-diseno-sistema/vision-general.qmd
        text: Diseño del sistema
      - href: 03-implementacion/index.qmd
        text: Implementación
      - href: 04-guias-desarrollo/convenciones-codigo.qmd
        text: Desarrollo
      - href: 05-decisiones-tecnicas/index.qmd
        text: ADRs
      - href: 06-changelog/index.qmd
        text: Changelog
      - href: 07-spikes/index.qmd
        text: Spikes
  sidebar:
    style: docked #investigar sobre mas estilos
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      - 00-prd/PRD.qmd
      - section: "Primeros pasos"
        contents: "01-primeros-pasos/*.qmd"
      - section: "Diseño del sistema"
        contents: "02-diseno-sistema/*.qmd"
      - section: "Detalles de implementación"
        contents: "03-implementacion/*.qmd"
      - section: "Guías de desarrollo"
        contents: "04-guias-desarrollo/*.qmd"
      - section: "Decisiones técnicas (ADRs)"
        contents: "05-decisiones-tecnicas/*.qmd"
      - section: "Changelog"
        contents: "06-changelog/*.qmd"
      - section: "Spikes"
        contents: "07-spikes/*.qmd"


#investigar mas temas y formas
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
